name: CI

# Roda em Pull Requests e em pushes para qualquer branch que NÃO seja main.
# Serve para validar antes de mergear: o site builda? o Terraform está válido?
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  web:
    name: Build & lint do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build (export estático)
        working-directory: web
        run: npm run build

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Checar formatação
        run: terraform fmt -check -recursive terraform/

      - name: Validar bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validar infra
        working-directory: terraform/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
