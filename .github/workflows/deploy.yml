name: Deploy

# Publica o site sempre que algo entra na main (ou manualmente pelo botão
# "Run workflow" na aba Actions).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões do token do job:
#   id-token: write  -> OBRIGATÓRIO para o OIDC funcionar (gera o token que a
#                       AWS troca por credenciais temporárias).
#   contents: read   -> ler o código do repositório.
permissions:
  id-token: write
  contents: read

# Evita dois deploys simultâneos pisando um no outro.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e publicar na AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Build (export estático -> web/out)
        working-directory: web
        run: npm run build

      # Autentica na AWS via OIDC. Não há chave fixa: o GitHub gera um token e
      # a AWS devolve credenciais temporárias para assumir a role.
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Sobe os arquivos para o S3. --delete remove do bucket o que não existe
      # mais no build (mantém o bucket espelhando exatamente a pasta out/).
      - name: Sincronizar arquivos no S3
        run: aws s3 sync web/out "s3://${{ vars.AWS_S3_BUCKET }}" --delete

      # Limpa o cache do CloudFront para servir a versão nova imediatamente.
      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
