name: Deploy

# Publishes the site whenever something lands on main (or manually via the
# "Run workflow" button on the Actions tab).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Job token permissions:
#   id-token: write  -> REQUIRED for OIDC to work (generates the token that AWS
#                       exchanges for temporary credentials).
#   contents: read   -> read the repository code.
permissions:
  id-token: write
  contents: read

# Avoids two deploys running at the same time and stepping on each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (static export -> web/out)
        working-directory: web
        run: npm run build

      # Authenticates to AWS via OIDC. There is no static key: GitHub generates a
      # token and AWS returns temporary credentials to assume the role.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Uploads the files to S3. --delete removes from the bucket whatever no
      # longer exists in the build (keeps the bucket mirroring the out/ folder).
      - name: Sync files to S3
        run: aws s3 sync web/out "s3://${{ vars.AWS_S3_BUCKET }}" --delete

      # Clears the CloudFront cache to serve the new version immediately.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
